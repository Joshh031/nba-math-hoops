<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<title>Our Shopping List 🛒</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="firebase-config.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a202c;
    --text-soft: #64748b;
    --line: #e5e9ef;
    --accent: #10b981;
    --accent-soft: #d1fae5;
    --red: #ef4444;       --red-soft: #fee2e2;   --red-text: #b91c1c;
    --amber: #f59e0b;     --amber-soft: #fef3c7; --amber-text: #b45309;
    --green: #22c55e;     --green-soft: #dcfce7; --green-text: #15803d;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 4px 14px rgba(16, 24, 40, .05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --card: #1a2129;
      --text: #edf2f7;
      --text-soft: #94a3b8;
      --line: #2b3541;
      --accent: #34d399;
      --accent-soft: #064e3b;
      --red-soft: #451a1a;   --red-text: #fca5a5;
      --amber-soft: #451a03; --amber-text: #fcd34d;
      --green-soft: #052e16; --green-text: #86efac;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 130px; /* room for the fixed add bar */
    overscroll-behavior-y: contain;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 22px; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .whoami {
    border: none; background: var(--card); color: var(--text-soft);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow);
  }
  .sync-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border: none; border-radius: 999px;
    padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--text-soft);
    box-shadow: var(--shadow);
  }
  .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; }
  .sync-pill.live .sync-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sync-pill.live { color: var(--accent); }

  /* ---------- Priority sections ---------- */
  main { padding: 4px 16px; max-width: 640px; margin: 0 auto; }
  .section { margin-bottom: 18px; }
  .section-head {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 15px; margin: 14px 2px 8px;
  }
  .section-head .count {
    font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  }
  .section-today .section-head { color: var(--red-text); }
  .section-today .count { background: var(--red-soft); color: var(--red-text); }
  .section-soon .section-head { color: var(--amber-text); }
  .section-soon .count { background: var(--amber-soft); color: var(--amber-text); }
  .section-later .section-head { color: var(--green-text); }
  .section-later .count { background: var(--green-soft); color: var(--green-text); }

  .cat-group { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
  .cat-title {
    font-size: 12.5px; font-weight: 700; color: var(--text-soft);
    padding: 10px 14px 4px; text-transform: uppercase; letter-spacing: .04em;
  }

  /* ---------- Item rows ---------- */
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-top: 1px solid var(--line);
    animation: pop-in .18s ease-out;
  }
  .cat-title + .item { border-top: none; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2.5px solid var(--line); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: white; transition: all .15s;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 16.5px; font-weight: 600; transition: opacity .2s; word-break: break-word; }
  .item.done .item-name { text-decoration: line-through; opacity: .45; }
  .item-meta { font-size: 12.5px; color: var(--text-soft); margin-top: 1px; }
  .item-meta button { background: none; border: none; color: inherit; font-size: inherit; padding: 0; }
  .prio-btn {
    flex: none; border: none; border-radius: 999px;
    font-size: 12px; font-weight: 700; padding: 6px 10px;
  }
  .prio-btn.today { background: var(--red-soft); color: var(--red-text); }
  .prio-btn.soon  { background: var(--amber-soft); color: var(--amber-text); }
  .prio-btn.later { background: var(--green-soft); color: var(--green-text); }
  .del-btn {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: transparent; color: var(--text-soft); font-size: 17px;
  }
  .del-btn:active { background: var(--red-soft); color: var(--red-text); }

  /* ---------- Completed ---------- */
  .done-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: none; border: none; color: var(--text-soft);
    font-weight: 700; font-size: 14px; padding: 12px 2px 8px;
  }
  .done-toggle .chev { transition: transform .2s; }
  .done-toggle.open .chev { transform: rotate(90deg); }
  .clear-done {
    margin: 10px auto 0; display: block;
    background: var(--card); color: var(--red-text); border: none;
    border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px;
    box-shadow: var(--shadow);
  }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center; color: var(--text-soft); padding: 56px 24px;
  }
  .empty .big { font-size: 52px; margin-bottom: 10px; }
  .empty p { font-size: 16px; line-height: 1.5; margin: 0; }

  /* ---------- Add bar ---------- */
  .add-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(16,24,40,.08);
  }
  .add-bar-inner { max-width: 640px; margin: 0 auto; }
  .prio-picker { display: flex; gap: 6px; margin-bottom: 9px; }
  .prio-picker button {
    flex: 1; border: 2px solid transparent; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; padding: 7px 4px;
    background: var(--bg); color: var(--text-soft);
  }
  .prio-picker button.sel-today { background: var(--red-soft); color: var(--red-text); border-color: var(--red); }
  .prio-picker button.sel-soon  { background: var(--amber-soft); color: var(--amber-text); border-color: var(--amber); }
  .prio-picker button.sel-later { background: var(--green-soft); color: var(--green-text); border-color: var(--green); }
  .input-row { display: flex; gap: 8px; align-items: center; }
  .cat-chip {
    flex: none; border: none; background: var(--bg);
    border-radius: 12px; font-size: 21px; width: 46px; height: 46px;
  }
  .add-input {
    flex: 1; min-width: 0; height: 46px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); color: var(--text);
    padding: 0 14px; font-size: 16px; outline: none;
  }
  .add-input:focus { border-color: var(--accent); }
  .mic-btn, .add-btn {
    flex: none; width: 46px; height: 46px; border-radius: 12px; border: none;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
  }
  .mic-btn { background: var(--bg); color: var(--text); }
  .mic-btn.listening {
    background: var(--red); color: white;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.45); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
  .add-btn { background: var(--accent); color: white; font-weight: 800; }
  .add-btn:disabled { opacity: .4; }
  .voice-hint { font-size: 12px; color: var(--text-soft); text-align: center; margin-top: 7px; min-height: 15px; }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,14,20,.55);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade .15s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    background: var(--card); width: 100%; max-width: 640px;
    border-radius: 22px 22px 0 0; padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
    animation: rise .2s ease-out;
  }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet .sub { color: var(--text-soft); font-size: 14px; margin: 0 0 16px; }
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-grid button {
    border: 2px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 14px; padding: 12px 6px; font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .cat-grid button .emoji { font-size: 24px; }
  .cat-grid button.selected { border-color: var(--accent); background: var(--accent-soft); }
  .name-input {
    width: 100%; height: 50px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg); color: var(--text); padding: 0 14px; font-size: 17px; outline: none;
  }
  .ic-scope { display: flex; gap: 6px; margin: 4px 0 14px; }
  .ic-scope button {
    flex: 1; border: 2px solid var(--line); border-radius: 999px;
    font-size: 12.5px; font-weight: 700; padding: 8px 4px;
    background: var(--bg); color: var(--text-soft);
  }
  .ic-scope button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .ic-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 40vh; overflow-y: auto; }
  .ic-list a {
    display: block; padding: 12px 14px; background: var(--bg); border-radius: 12px;
    color: var(--text); font-weight: 600; text-decoration: none;
  }
  .name-input:focus { border-color: var(--accent); }
  .primary-btn {
    width: 100%; margin-top: 14px; height: 50px; border: none; border-radius: 12px;
    background: var(--accent); color: white; font-size: 17px; font-weight: 800;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(140px + env(safe-area-inset-bottom)); z-index: 60;
    background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600;
    display: flex; gap: 14px; align-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    animation: rise .2s ease-out; max-width: 90vw;
  }
  .toast button {
    background: none; border: none; color: var(--accent);
    font-weight: 800; font-size: 14.5px; padding: 0;
  }
</style>
</head>
<body>

<header>
  <h1>🛒 Our List</h1>
  <button class="whoami" id="instacartBtn" title="Send list to Instacart">🥕</button>
  <button class="whoami" id="whoamiBtn" title="Change your name">…</button>
  <button class="sync-pill" id="syncPill" title="Sync status">
    <span class="sync-dot"></span><span id="syncLabel">Local</span>
  </button>
</header>

<main id="list"></main>

<div class="add-bar">
  <div class="add-bar-inner">
    <div class="prio-picker" id="prioPicker">
      <button data-p="today">🔴 Need today</button>
      <button data-p="soon">🟡 1–2 days</button>
      <button data-p="later">🟢 Not urgent</button>
    </div>
    <div class="input-row">
      <button class="cat-chip" id="catChip" title="Change category">🛒</button>
      <input class="add-input" id="addInput" type="text" placeholder="Add an item…"
             autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
      <button class="mic-btn" id="micBtn" title="Add by voice">🎤</button>
      <button class="add-btn" id="addBtn" title="Add" disabled>+</button>
    </div>
    <div class="voice-hint" id="voiceHint"></div>
  </div>
</div>

<script>
'use strict';

/* ================= Categories & priorities ================= */

const CATEGORIES = {
  produce:   { label: 'Produce',        emoji: '🥬' },
  dairy:     { label: 'Dairy & Eggs',   emoji: '🥛' },
  meat:      { label: 'Meat & Seafood', emoji: '🍖' },
  bakery:    { label: 'Bakery',         emoji: '🥐' },
  frozen:    { label: 'Frozen',         emoji: '🧊' },
  pantry:    { label: 'Pantry',         emoji: '🥫' },
  beverages: { label: 'Beverages',      emoji: '☕' },
  snacks:    { label: 'Snacks',         emoji: '🍿' },
  household: { label: 'Household',      emoji: '🧻' },
  personal:  { label: 'Personal Care',  emoji: '🧴' },
  pets:      { label: 'Pets',           emoji: '🐾' },
  other:     { label: 'Other',          emoji: '🛒' },
};
const CATEGORY_ORDER = Object.keys(CATEGORIES);

const KEYWORDS = {
  produce: ['apple','banana','orange','grape','berries','berry','strawberr','blueberr','raspberr','lettuce','spinach','kale','tomato','potato','sweet potato','onion','garlic','carrot','celery','broccoli','cauliflower','bell pepper','pepper','cucumber','zucchini','squash','avocado','lemon','lime','mango','peach','pear','plum','melon','watermelon','cantaloupe','pineapple','cilantro','parsley','basil','ginger','mushroom','corn','salad','greens','fruit','vegetable','veggie','cabbage','asparagus','green bean','herbs'],
  dairy: ['milk','cheese','yogurt','yoghurt','butter','cream','egg','sour cream','cottage cheese','half and half','creamer','mozzarella','cheddar','parmesan','feta'],
  meat: ['chicken','beef','pork','turkey','ham','bacon','sausage','steak','ground beef','ground turkey','fish','salmon','tuna steak','shrimp','tilapia','cod','hot dog','deli','lunch meat','ribs','lamb','meatball','brisket','rotisserie'],
  bakery: ['bread','bagel','bun','rolls','tortilla','muffin','croissant','cake','pie','donut','doughnut','pita','baguette','english muffin','naan'],
  frozen: ['frozen','ice cream','pizza','popsicle','waffles','ice','sorbet','frozen fruit','frozen veg'],
  pantry: ['rice','pasta','noodle','spaghetti','cereal','oats','oatmeal','flour','sugar','salt','spice','olive oil','vegetable oil','oil','vinegar','sauce','salsa','soup','beans','canned','can of','peanut butter','jelly','jam','honey','maple syrup','syrup','ketchup','mustard','mayo','mayonnaise','dressing','broth','stock','tuna','tomato paste','baking','yeast','vanilla','quinoa','lentil','taco'],
  beverages: ['water','juice','soda','pop','coffee','tea','wine','beer','sparkling','gatorade','lemonade','kombucha','drink','oat milk','almond milk','soy milk','coconut water','energy drink','cider'],
  snacks: ['chips','crackers','cookie','candy','chocolate','popcorn','pretzel','granola','protein bar','snack bar','nuts','almonds','cashews','trail mix','fruit snack','gummy','jerky','hummus','graham'],
  household: ['paper towel','toilet paper','tissue','detergent','dish soap','dish','sponge','trash bag','garbage bag','cleaner','bleach','foil','aluminum','plastic wrap','saran','ziploc','sandwich bag','battery','batteries','light bulb','laundry','fabric softener','dryer sheet','air freshener','candle','napkin','paper plate'],
  personal: ['shampoo','conditioner','toothpaste','toothbrush','deodorant','lotion','razor','shaving','floss','body wash','soap','sunscreen','makeup','vitamin','medicine','tylenol','advil','ibuprofen','band-aid','bandaid','diaper','wipes','q-tip','cotton','chapstick','lip balm','feminine','tampon','pad'],
  pets: ['dog food','cat food','dog treat','cat treat','litter','pet','dog','cat','bird seed','fish food','flea'],
};

const PRIORITIES = {
  today: { label: 'Need today', short: '🔴 Today',    order: 0, cls: 'today', head: '🔴 Need Today' },
  soon:  { label: '1–2 days',   short: '🟡 1–2 days', order: 1, cls: 'soon',  head: '🟡 Next 1–2 Days' },
  later: { label: 'Not urgent', short: '🟢 No rush',  order: 2, cls: 'later', head: '🟢 Not Urgent' },
};
const PRIORITY_CYCLE = ['today', 'soon', 'later'];

function detectCategory(name) {
  const s = name.toLowerCase();
  let best = 'other', bestLen = 0;
  for (const [cat, words] of Object.entries(KEYWORDS)) {
    for (const w of words) {
      if (s.includes(w) && w.length > bestLen) { best = cat; bestLen = w.length; }
    }
  }
  return best;
}

/* ================= Storage backends ================= */

// Both backends expose: set(id, item), remove(id), and fire
// onItems(itemsObj) + onStatus(isLive) callbacks.

function makeLocalStore(onItems, onStatus, onConfig) {
  const KEY = 'shoplist-items-v1';
  const CKEY = 'shoplist-config-v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const readC = () => { try { return JSON.parse(localStorage.getItem(CKEY)) || {}; } catch { return {}; } };
  const write = (obj) => localStorage.setItem(KEY, JSON.stringify(obj));
  // storage events sync the list across tabs on the same device
  window.addEventListener('storage', (e) => {
    if (e.key === KEY) onItems(read());
    if (e.key === CKEY) onConfig(readC());
  });
  onStatus(false);
  onItems(read());
  onConfig(readC());
  return {
    set(id, item) { const o = read(); o[id] = item; write(o); onItems(o); },
    remove(id)    { const o = read(); delete o[id]; write(o); onItems(o); },
    setConfig(key, val) { const c = readC(); c[key] = val; localStorage.setItem(CKEY, JSON.stringify(c)); onConfig(c); },
    logDone(entry) {
      const HKEY = 'shoplist-history-v1';
      let h = []; try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch {}
      h.push(entry);
      localStorage.setItem(HKEY, JSON.stringify(h.slice(-500)));
    },
  };
}

function makeFirebaseStore(config, onItems, onStatus, onFail, onConfig) {
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  const V = '10.12.2';
  const base = `https://www.gstatic.com/firebasejs/${V}/`;
  let api = null;

  load(base + 'firebase-app-compat.js')
    .then(() => Promise.all([
      load(base + 'firebase-database-compat.js'),
      load(base + 'firebase-auth-compat.js'),
    ]))
    .then(() => {
      firebase.initializeApp(config);
      // Anonymous sign-in lets you lock DB rules to "auth != null".
      // If Anonymous auth isn't enabled in the Firebase console this
      // rejects, which is fine when rules are open — just continue.
      return firebase.auth().signInAnonymously().catch(() => {});
    })
    .then(() => {
      const db = firebase.database();
      const ref = db.ref('lists/family/items');
      ref.on('value',
        (snap) => onItems(snap.val() || {}),
        () => { onFail('Firebase rejected reads — check your database rules.'); });
      db.ref('.info/connected').on('value', (snap) => onStatus(!!snap.val()));
      api = ref;
      histApi = db.ref('lists/family/history');
      confApi = db.ref('lists/family/config');
      confApi.on('value', (snap) => onConfig(snap.val() || {}));
    })
    .catch(() => onFail('Could not load Firebase — check your internet connection.'));

  let histApi = null;
  let confApi = null;
  return {
    set(id, item) { if (api) api.child(id).set(item); },
    remove(id)    { if (api) api.child(id).remove(); },
    logDone(entry) { if (histApi) histApi.push(entry); },
    setConfig(key, val) { if (confApi) confApi.child(key).set(val); },
  };
}

/* ================= State ================= */

let items = {};          // id -> { n, c, p, d, by, t }
let store = null;
let isLive = false;
let userName = localStorage.getItem('shoplist-name') || '';
let selPriority = 'soon';
let catOverride = null;  // manual category pick for the item being typed
let doneOpen = false;

const $ = (id) => document.getElementById(id);
const listEl = $('list');
const addInput = $('addInput');
const addBtn = $('addBtn');
const catChip = $('catChip');
const micBtn = $('micBtn');
const voiceHint = $('voiceHint');

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ================= Rendering ================= */

function render() {
  const all = Object.entries(items).map(([id, it]) => ({ id, ...it }));
  const active = all.filter((i) => !i.d);
  const done = all.filter((i) => i.d).sort((a, b) => b.t - a.t);

  let html = '';

  if (!all.length) {
    html = `<div class="empty">
      <div class="big">🧺</div>
      <p><b>Your list is empty!</b><br>
      Type an item below, or tap 🎤 and just say what you need.</p>
    </div>`;
  }

  for (const p of PRIORITY_CYCLE) {
    const group = active.filter((i) => i.p === p);
    if (!group.length) continue;
    html += `<div class="section section-${p}">
      <div class="section-head">${PRIORITIES[p].head}
        <span class="count">${group.length}</span></div>`;
    for (const cat of CATEGORY_ORDER) {
      const inCat = group.filter((i) => (i.c || 'other') === cat).sort((a, b) => a.t - b.t);
      if (!inCat.length) continue;
      html += `<div class="cat-group">
        <div class="cat-title">${CATEGORIES[cat].emoji} ${CATEGORIES[cat].label}</div>`;
      for (const it of inCat) html += itemRow(it);
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (done.length) {
    html += `<button class="done-toggle ${doneOpen ? 'open' : ''}" onclick="toggleDone()">
      <span class="chev">▶</span> Completed (${done.length})</button>`;
    if (doneOpen) {
      html += `<div class="cat-group">`;
      for (const it of done) html += itemRow(it);
      html += `</div>
      <button class="clear-done" onclick="clearDone()">🗑 Clear completed</button>`;
    }
  }

  listEl.innerHTML = html;
}

function itemRow(it) {
  const cat = CATEGORIES[it.c] || CATEGORIES.other;
  const pr = PRIORITIES[it.p] || PRIORITIES.later;
  const by = it.by ? ` · ${esc(it.by)}` : '';
  return `<div class="item ${it.d ? 'done' : ''}" data-id="${it.id}">
    <button class="check" onclick="toggleItem('${it.id}')" aria-label="Mark done">${it.d ? '✓' : ''}</button>
    <div class="item-body" onclick="toggleItem('${it.id}')">
      <div class="item-name">${esc(it.n)}</div>
      <div class="item-meta">
        <button onclick="event.stopPropagation(); pickCategory('${it.id}')" title="Change category">${cat.emoji} ${cat.label}</button>${by}
      </div>
    </div>
    ${it.d ? '' : `<button class="prio-btn ${pr.cls}" onclick="cyclePriority('${it.id}')" title="Change priority">${pr.short}</button>`}
    <button class="del-btn" onclick="deleteItem('${it.id}')" aria-label="Delete">✕</button>
  </div>`;
}

/* ================= Item actions ================= */

function addItem(name, priority, category) {
  name = name.trim();
  if (!name) return;
  name = name[0].toUpperCase() + name.slice(1);
  const id = newId();
  store.set(id, {
    n: name,
    c: category || detectCategory(name),
    p: priority || selPriority,
    d: false,
    by: userName || 'Someone',
    t: Date.now(),
  });
}

window.toggleItem = (id) => {
  const it = items[id];
  if (!it) return;
  store.set(id, { ...it, d: !it.d, t: Date.now() });
  if (!it.d) {
    // just checked off = purchased; the history powers restock reminders
    store.logDone?.({ n: it.n, c: it.c || 'other', t: Date.now(), by: it.by || '' });
    if (navigator.vibrate) navigator.vibrate(15);
  }
};

window.cyclePriority = (id) => {
  const it = items[id];
  if (!it) return;
  const next = PRIORITY_CYCLE[(PRIORITY_CYCLE.indexOf(it.p) + 1) % PRIORITY_CYCLE.length];
  store.set(id, { ...it, p: next });
};

window.deleteItem = (id) => {
  const it = items[id];
  if (!it) return;
  store.remove(id);
  showToast(`Deleted “${it.n.length > 24 ? it.n.slice(0, 24) + '…' : it.n}”`, {
    action: 'Undo',
    onAction: () => store.set(id, it),
  });
};

window.toggleDone = () => { doneOpen = !doneOpen; render(); };

window.clearDone = () => {
  const done = Object.entries(items).filter(([, it]) => it.d);
  done.forEach(([id]) => store.remove(id));
  showToast(`Cleared ${done.length} item${done.length === 1 ? '' : 's'} ✨`);
};

/* ================= Category picker ================= */

window.pickCategory = (idOrNull) => {
  const current = idOrNull ? (items[idOrNull]?.c || 'other')
                           : (catOverride || detectCategory(addInput.value || ''));
  const grid = CATEGORY_ORDER.map((c) => `
    <button class="${c === current ? 'selected' : ''}" data-cat="${c}">
      <span class="emoji">${CATEGORIES[c].emoji}</span>${CATEGORIES[c].label}
    </button>`).join('');
  openSheet(`
    <h2>Pick a category</h2>
    <p class="sub">Items are grouped by category so shopping is faster.</p>
    <div class="cat-grid">${grid}</div>
  `, (sheet, close) => {
    sheet.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => {
      const cat = b.dataset.cat;
      if (idOrNull) {
        store.set(idOrNull, { ...items[idOrNull], c: cat });
      } else {
        catOverride = cat;
        catChip.textContent = CATEGORIES[cat].emoji;
      }
      close();
    });
  });
};

/* ================= Sheets, toasts, name ================= */

let toastTimer = null;
function showToast(msg, opts = {}) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (opts.action) {
    const b = document.createElement('button');
    b.textContent = opts.action;
    b.onclick = () => { opts.onAction?.(); t.remove(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), opts.duration || 4500);
}

function openSheet(innerHtml, wire) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet">${innerHtml}</div>`;
  const close = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) close(); };
  document.body.appendChild(ov);
  wire?.(ov.firstElementChild, close);
  return close;
}

function askName(firstTime) {
  openSheet(`
    <h2>${firstTime ? '👋 Welcome!' : 'Change your name'}</h2>
    <p class="sub">Your name shows next to items you add, so you both know who wants what.</p>
    <input class="name-input" id="nameField" type="text" maxlength="20"
           placeholder="e.g. Josh" value="${esc(userName)}">
    <button class="primary-btn" id="nameSave">Let's go 🛒</button>
  `, (sheet, close) => {
    const field = sheet.querySelector('#nameField');
    const save = () => {
      const v = field.value.trim();
      if (!v) { field.focus(); return; }
      userName = v;
      localStorage.setItem('shoplist-name', v);
      $('whoamiBtn').textContent = `👤 ${v}`;
      close();
    };
    sheet.querySelector('#nameSave').onclick = save;
    field.onkeydown = (e) => { if (e.key === 'Enter') save(); };
    setTimeout(() => field.focus(), 250);
  });
}

/* ================= Add bar wiring ================= */

function setPriority(p) {
  selPriority = p;
  $('prioPicker').querySelectorAll('button').forEach((b) => {
    b.className = b.dataset.p === p ? `sel-${p}` : '';
  });
}
$('prioPicker').querySelectorAll('button').forEach((b) => {
  b.onclick = () => setPriority(b.dataset.p);
});
setPriority('soon');

function submitTyped() {
  const v = addInput.value.trim();
  if (!v) return;
  addItem(v, selPriority, catOverride);
  addInput.value = '';
  catOverride = null;
  catChip.textContent = '🛒';
  addBtn.disabled = true;
  addInput.focus();
}
addBtn.onclick = submitTyped;
addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTyped(); });
addInput.addEventListener('input', () => {
  addBtn.disabled = !addInput.value.trim();
  if (!catOverride) {
    const c = detectCategory(addInput.value);
    catChip.textContent = CATEGORIES[c].emoji;
  }
});
catChip.onclick = () => pickCategory(null);

/* ================= Voice input ================= */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  micBtn.style.display = 'none';
} else {
  let rec = null;
  let listening = false;

  const stopUI = () => {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    addInput.placeholder = 'Add an item…';
  };

  micBtn.onclick = () => {
    if (listening) { rec?.stop(); return; }
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true;
    rec.continuous = false;

    listening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '⏹';
    addInput.placeholder = 'Listening…';
    voiceHint.textContent = 'Try: “milk and bananas” or “diapers, urgent”';

    let finalText = '';
    rec.onresult = (e) => {
      let interim = '';
      for (const r of e.results) {
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      addInput.value = finalText || interim;
    };
    rec.onerror = (e) => {
      stopUI();
      addInput.value = '';
      voiceHint.textContent = e.error === 'not-allowed'
        ? 'Microphone blocked — allow mic access in your browser settings.'
        : 'Didn’t catch that — tap 🎤 and try again.';
    };
    rec.onend = () => {
      stopUI();
      if (finalText.trim()) {
        const added = addFromSpeech(finalText);
        addInput.value = '';
        addBtn.disabled = true;
        voiceHint.textContent = '';
        if (added.length) {
          showToast(`🎤 Added ${added.length === 1 ? `“${added[0]}”` : added.length + ' items'}`);
        }
      } else if (!addInput.value.trim()) {
        voiceHint.textContent = '';
      }
    };
    rec.start();
  };
}

// "milk, eggs and bread urgent" -> three items; priority words are understood
function addFromSpeech(text) {
  const added = [];
  let base = text.toLowerCase()
    .replace(/^(please\s+)?(add|we need|i need|get|buy|pick up)\s+/i, '');
  const parts = base.split(/\s*,\s*|\s+and\s+|\s+also\s+|\s+plus\s+/i);
  for (let part of parts) {
    let p = selPriority;
    if (/\b(urgent|asap|today|right away|right now|immediately)\b/.test(part)) p = 'today';
    else if (/\b(soon|tomorrow|next couple|couple of days|this week)\b/.test(part)) p = 'soon';
    else if (/\b(no rush|not urgent|whenever|later|eventually)\b/.test(part)) p = 'later';
    part = part
      .replace(/\b(urgent|asap|today|right away|right now|immediately|soon|tomorrow|no rush|not urgent|whenever|later|eventually)\b/g, '')
      .replace(/\s{2,}/g, ' ').trim();
    if (!part) continue;
    addItem(part, p);
    added.push(part[0].toUpperCase() + part.slice(1));
  }
  return added;
}

/* ================= Instacart ================= */

let instacartKey = null;
function onConfigCb(c) { instacartKey = (c && c.instacartKey) || null; }

const activeItems = () => Object.entries(items).map(([id, it]) => ({ id, ...it })).filter((i) => !i.d);
const scopeFilter = {
  today: (i) => i.p === 'today',
  soon:  (i) => i.p === 'today' || i.p === 'soon',
  all:   () => true,
};

$('instacartBtn').onclick = () => {
  const active = activeItems();
  if (!active.length) { showToast('Nothing on the list to order 🎉'); return; }
  const n = (s) => active.filter(scopeFilter[s]).length;
  let scope = n('today') ? 'today' : 'all';

  openSheet(`
    <h2>🥕 Send to Instacart</h2>
    <p class="sub">Creates an Instacart page with these items ready to add to a cart for delivery.</p>
    <div class="ic-scope" id="icScope">
      <button data-s="today">🔴 Today (${n('today')})</button>
      <button data-s="soon">🔴+🟡 (${n('soon')})</button>
      <button data-s="all">Everything (${active.length})</button>
    </div>
    ${instacartKey ? '' : `
      <p class="sub"><b>One-time setup:</b> create a free API key at
      <a href="https://www.instacart.com/developers" target="_blank" rel="noopener">instacart.com/developers</a>
      (sign up → create key), paste it below once, and it syncs to both phones.</p>
      <input class="name-input" id="icKey" type="text" placeholder="Paste Instacart API key…" autocomplete="off">
    `}
    <button class="primary-btn" id="icGo">Create Instacart list</button>
  `, (sheet, close) => {
    const scopeBtns = sheet.querySelectorAll('#icScope button');
    const paint = () => scopeBtns.forEach((b) => b.classList.toggle('on', b.dataset.s === scope));
    scopeBtns.forEach((b) => b.onclick = () => { scope = b.dataset.s; paint(); });
    paint();

    const go = sheet.querySelector('#icGo');
    go.onclick = async () => {
      const keyField = sheet.querySelector('#icKey');
      const key = instacartKey || (keyField && keyField.value.trim());
      if (!key) { keyField?.focus(); return; }
      const sel = activeItems().filter(scopeFilter[scope]);
      if (!sel.length) { showToast('No items in that group'); return; }

      go.disabled = true;
      go.textContent = 'Creating…';
      try {
        const resp = await fetch('https://connect.instacart.com/idp/v1/products/products_link', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + key,
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({
            title: 'Our Shopping List',
            link_type: 'shopping_list',
            line_items: sel.map((i) => ({ name: i.n })),
          }),
        });
        if (resp.status === 401 || resp.status === 403) {
          go.disabled = false; go.textContent = 'Create Instacart list';
          showToast('⚠️ Instacart rejected the API key — double-check it.', { duration: 6000 });
          return;
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (!data.products_link_url) throw new Error('no URL in response');
        if (keyField && !instacartKey) store.setConfig('instacartKey', key);
        close();
        showToast('Instacart list ready 🥕');
        window.open(data.products_link_url, '_blank');
      } catch (err) {
        // CORS block or network failure — fall back to per-item search links
        if (keyField && keyField.value.trim() && !instacartKey) store.setConfig('instacartKey', key);
        close();
        instacartFallback(sel);
      }
    };
  });
};

function instacartFallback(sel) {
  const links = sel.map((i) =>
    `<a href="https://www.instacart.com/store/s?k=${encodeURIComponent(i.n)}" target="_blank" rel="noopener">🔎 ${esc(i.n)}</a>`
  ).join('');
  openSheet(`
    <h2>🥕 Open on Instacart</h2>
    <p class="sub">Couldn't create the list automatically (Instacart blocked the direct
    connection from the browser). Tap items to search them on Instacart, or copy the
    whole list and paste it there.</p>
    <div class="ic-list">${links}</div>
    <button class="primary-btn" id="icCopy">📋 Copy list</button>
  `, (sheet) => {
    sheet.querySelector('#icCopy').onclick = () => {
      navigator.clipboard?.writeText(sel.map((i) => i.n).join('\n'))
        .then(() => showToast('List copied 📋'))
        .catch(() => showToast('Copy failed — long-press to select instead'));
    };
  });
}

/* ================= Sync status & boot ================= */

function onItems(obj) { items = obj || {}; render(); }
function onStatus(live) {
  isLive = live;
  const pill = $('syncPill');
  pill.classList.toggle('live', live);
  $('syncLabel').textContent = live ? 'Live' : (window.FIREBASE_CONFIG ? 'Offline' : 'Local');
}

$('syncPill').onclick = () => {
  openSheet(window.FIREBASE_CONFIG ? `
    <h2>${isLive ? '🟢 Live sync is on' : '🔌 Reconnecting…'}</h2>
    <p class="sub">${isLive
      ? 'Every change shows up instantly on both of your phones.'
      : 'You seem to be offline. Changes will sync when you’re back online.'}</p>
  ` : `
    <h2>📱 Local mode</h2>
    <p class="sub">Right now the list only lives on this device. To share it live with
    your wife, follow the free 10-minute setup in the README on GitHub —
    then you’ll both see every change instantly.</p>
    <button class="primary-btn" onclick="window.open('https://github.com/Joshh031/shopping-list#-set-up-live-sync-10-minutes','_blank')">Open setup guide</button>
  `);
};

$('whoamiBtn').onclick = () => askName(false);

(function boot() {
  if (window.FIREBASE_CONFIG) {
    store = makeFirebaseStore(window.FIREBASE_CONFIG, onItems, onStatus, (msg) => {
      showToast('⚠️ ' + msg, { duration: 8000 });
      store = makeLocalStore(onItems, onStatus, onConfigCb);
    }, onConfigCb);
    render();
  } else {
    store = makeLocalStore(onItems, onStatus, onConfigCb);
  }
  $('whoamiBtn').textContent = userName ? `👤 ${userName}` : '👤 Set name';
  if (!userName) askName(true);
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
